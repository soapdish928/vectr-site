# Cloudflare Workers config (static assets + one small Worker for the contact form).
# `name` must match the Worker's name in the Cloudflare dashboard.
name = "vectr-site"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
CONTACT_TO = "info@vectr.uk"
CONTACT_FROM = "Vectr website <website@vectr.uk>"
SEND_CONFIRMATION = "true"
GOOGLE_PLACE_ID = "ChIJhcAQbabkKiwRwsMm_kWfr34"

# Secrets are NOT stored here. Set them in the Cloudflare dashboard
# (Workers & Pages → vectr-site → Settings → Variables and Secrets), or locally in .dev.vars:
#   TURNSTILE_SECRET_KEY
#   RESEND_API_KEY
#   GOOGLE_PLACES_API_KEY
